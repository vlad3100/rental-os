[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rental-copilot"
version = "0.1.0"
description = "Munich Rental Copilot: human-in-the-loop inquiry-to-viewing copilot. Synthetic demo, not production-ready."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
rental-copilot = "rental_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared in default arguments by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
